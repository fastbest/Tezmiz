plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.fastbest.kartformat'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.fastbest.kartformat'
        minSdk 21
        targetSdk 34
        versionCode 35
        versionName '7.2'
    }

    signingConfigs {
        stable {
            // Her derleme aynı imzayı taşısın: telefonda eski sürümün üzerine güncelleme kurulabilsin
            storeFile file('kartformat.jks')
            storePassword 'kartformat'
            keyAlias 'kartformat'
            keyPassword 'kartformat'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true   // mkntfs dosya olarak açılsın ve çalıştırılabilsin
        }
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    // .xz imajlar ve 7z arşivleri (kamu malı / 0BSD)
    implementation 'org.tukaani:xz:1.10'
    // zip, tar, 7z, bzip2 (Apache-2.0)
    implementation 'org.apache.commons:commons-compress:1.24.0'
    // FTP istemcisi (Apache-2.0)
    implementation 'commons-net:commons-net:3.8.0'
    // WiFi dosya paylaşımı için küçük web sunucusu (BSD)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // FileProvider (Apache-2.0)
    implementation 'androidx.core:core:1.12.0'
    // Animasyonlu liste (Apache-2.0)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // RAR arşivlerine göz atma (UnRAR lisansı / LGPL)
    implementation 'com.github.junrar:junrar:7.5.5'
    // Windows paylaşımı / NAS (SMB2-3) istemcisi (Apache-2.0)
    implementation 'com.hierynomus:smbj:0.13.0'
    // SFTP (SSH) istemcisi (BSD)
    implementation 'com.github.mwiede:jsch:0.2.20'
}
