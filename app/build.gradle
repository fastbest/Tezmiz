plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.fastbest.kartformat'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.fastbest.kartformat'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
