name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: mkntfs önbelleği
        id: ntfs-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: mkntfs-${{ hashFiles('tools/build-mkntfs.sh') }}

      - name: Derleme araçları
        if: steps.ntfs-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool pkg-config libgcrypt20-dev

      - name: mkntfs (ntfs-3g) derle
        if: steps.ntfs-cache.outputs.cache-hit != 'true'
        run: bash tools/build-mkntfs.sh "$GITHUB_WORKSPACE/app/src/main/jniLibs"

      - name: Açılış kodu önbelleği
        id: boot-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/boot
          key: bootcode-${{ hashFiles('tools/fetch-bootcode.sh') }}

      - name: BIOS açılış kodu ve FreeDOS (Rufus / ms-sys)
        if: steps.boot-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch-bootcode.sh "$GITHUB_WORKSPACE/app/src/main/assets/boot"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk KartFormat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KartFormat
          path: KartFormat.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kart Format (son sürüm)
          files: KartFormat.apk
          make_latest: true
