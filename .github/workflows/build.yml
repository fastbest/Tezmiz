name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk KartFormat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KartFormat
          path: KartFormat.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kart Format (son sürüm)
          files: KartFormat.apk
          make_latest: true
